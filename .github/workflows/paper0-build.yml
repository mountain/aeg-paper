name: Paper and calibration integration checks

on:
  pull_request:
    paths:
      - "paper-0/**"
      - "paper-1/**"
      - "paper-4/**"
      - "paper-6/**"
      - "research/iota-carousel/**"
      - "research/donaghey-orbits/**"
      - "research/pants-interface-disks/verify_handles.py"
      - "research/pants-interface-disks/evidence-handles.json"
      - "research/pants-interface-disks/verify_v1.py"
      - "bibliography/**"
      - "build.sh"
      - ".github/workflows/paper0-build.yml"
  # Required-check contract: a push to ANY branch must produce this check.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-foundational-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the calibration dependency
        run: python3 -m pip install numpy==2.3.3

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Verify finite geometric and program calibrations
        run: |
          python3 paper-0/scripts/verify-compactification.py
          python3 paper-4/scripts/verify-paper4.py
          python3 paper-4/scripts/verify-ported-aes.py > /tmp/ported-aes.json
          cmp /tmp/ported-aes.json paper-4/scripts/fixtures/ported-aes/integration-evidence.json
          python3 -O paper-4/scripts/verify-ported-aes.py > /tmp/ported-aes-optimized.json
          cmp /tmp/ported-aes.json /tmp/ported-aes-optimized.json

      - name: Verify opposite-feature snapshot adapter
        run: |
          python3 paper-4/scripts/verify-opposite-features.py > /tmp/opposite-features.json
          cmp /tmp/opposite-features.json paper-4/scripts/fixtures/opposite-features/evidence.json
          python3 -O paper-4/scripts/verify-opposite-features.py > /tmp/opposite-features-optimized.json
          cmp /tmp/opposite-features.json /tmp/opposite-features-optimized.json

      - name: Verify finite process spectrum and cyclic prefixes
        run: |
          python3 paper-4/scripts/verify-process-spectrum.py > /tmp/process-spectrum.json
          cmp /tmp/process-spectrum.json paper-4/scripts/fixtures/process-spectrum/evidence.json
          python3 -O paper-4/scripts/verify-process-spectrum.py > /tmp/process-spectrum-optimized.json
          cmp /tmp/process-spectrum.json /tmp/process-spectrum-optimized.json

      - name: Independently receive process spectrum and reject mutations
        run: |
          python3 paper-4/scripts/receive-process-spectrum.py /tmp/process-spectrum.json > /tmp/process-receiver.json
          cmp /tmp/process-receiver.json paper-4/scripts/fixtures/process-spectrum/receiver-evidence.json
          python3 -O paper-4/scripts/receive-process-spectrum.py /tmp/process-spectrum.json > /tmp/process-receiver-O.json
          cmp /tmp/process-receiver.json /tmp/process-receiver-O.json

      - name: Verify the product tunnel and annular Stokes balance
        run: |
          python3 research/pants-interface-disks/verify_handles.py > /tmp/handles.json
          cmp /tmp/handles.json research/pants-interface-disks/evidence-handles.json
          python3 -O research/pants-interface-disks/verify_handles.py > /tmp/handles-O.json
          cmp /tmp/handles.json /tmp/handles-O.json

      - name: Build Paper 0
        run: ./build.sh 0

      - name: Build Paper I
        run: ./build.sh 1

      - name: Build Paper IV
        run: ./build.sh 4

      - name: Build Paper VI
        run: ./build.sh 6

      - name: Replay the iota-carousel and Donaghey calibrations
        run: |
          python3 research/iota-carousel/verify_planar.py /tmp/planar.json
          cmp /tmp/planar.json research/iota-carousel/evidence-planar-v1.json
          python3 research/iota-carousel/verify_shift.py /tmp/shift.json
          cmp /tmp/shift.json research/iota-carousel/evidence-shift-v1.json
          python3 research/iota-carousel/verify_canonical_choice.py /tmp/canonical.json
          cmp /tmp/canonical.json research/iota-carousel/evidence-canonical-choice-v1.json
          python3 research/iota-carousel/verify_omega.py /tmp/omega.json
          cmp /tmp/omega.json research/iota-carousel/evidence-omega-v1.json
          python3 research/donaghey-orbits/verify_orbits.py

      - name: Check important LaTeX warnings
        run: |
          status=0
          for log in paper-0/aeg-paper-0.log paper-1/aeg-paper-1.log paper-4/aeg-paper-4.log paper-6/aeg-paper-6.log; do
            if [ ! -f "$log" ]; then
              echo "$log is missing" >&2
              status=1
              continue
            fi
            if grep -E "(Undefined control sequence|LaTeX Warning: Reference .* undefined|LaTeX Warning: Citation .* undefined|There were undefined references|multiply defined)" "$log"; then
              echo "$log contains unresolved LaTeX warnings" >&2
              status=1
            fi
          done
          exit "$status"

      - name: Upload foundational PDFs
        uses: actions/upload-artifact@v4
        with:
          name: aeg-foundational-papers
          path: |
            paper-0/aeg-paper-0.pdf
            paper-1/aeg-paper-1.pdf
            paper-4/aeg-paper-4.pdf
            paper-6/aeg-paper-6.pdf
          if-no-files-found: error
