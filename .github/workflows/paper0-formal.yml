name: Paper 0 formal derivations

on:
  pull_request:
    paths:
      - 'paper-0/formal/**'
      - 'paper-0/sections/**'
      - 'paper-0/appendices/**'
      - 'paper-0/aeg-paper-0.tex'
      - '.github/workflows/paper0-formal.yml'
  push:
    branches: ['**']
  # Component coverage is source-bound. Historical execution snapshots retain
  # their own inventories; current navigation does not certify whole chapters.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-derivations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install blake3==1.0.9
      - name: Build the fixed external machine
        run: |
          git init "$RUNNER_TEMP/aeg-machine"
          git -C "$RUNNER_TEMP/aeg-machine" fetch --depth=1 https://github.com/mountain/adva-machine.git 51ee98981ebbc62f8614ed20920c11dc76ea298d
          git -C "$RUNNER_TEMP/aeg-machine" checkout --detach FETCH_HEAD
          cargo build --locked --manifest-path "$RUNNER_TEMP/aeg-machine/Cargo.toml" -p adva-witness --bin adva
      - name: Receive the pinned Lean release
        run: |
          curl --fail --location --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'lean.tar.zst'
          expected = 'b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec'
          if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit('Lean release digest mismatch')
          PY
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Check source, goals and negative-control inventory
        run: python -m unittest discover -s paper-0/formal -p 'test_*.py' -v
      - name: Check symbolic proofs, finite inductions and complete native traces
        run: |
          python paper-0/formal/chapter03_run.py \
            --machine-root "$RUNNER_TEMP/aeg-machine" \
            --binary "$RUNNER_TEMP/aeg-machine/target/debug/adva" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-formal-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-formal-evidence
          path: ${{ runner.temp }}/aeg-paper0-formal-evidence
          if-no-files-found: warn

  real-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install blake3==1.0.9
      - name: Receive the pinned Lean release
        run: |
          curl --fail --location --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'lean.tar.zst'
          expected = 'b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec'
          if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit('Lean release digest mismatch')
          PY
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Prepare and fingerprint pinned Mathlib
        run: |
          python paper-0/formal/prepare_analysis.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean-bin "$RUNNER_TEMP/lean-4.24.0-linux/bin"
      - name: Check actual real derivatives, model, Laplace, flow and rectification
        run: |
          python paper-0/formal/analysis_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-analysis-evidence"
      - name: Check Chapter 4 ripple formulas and pole laws
        run: |
          python paper-0/formal/chapter04_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-ripple-evidence"
      - name: Check Apollonius modulus, circles and bisectors
        run: |
          python paper-0/formal/apollonius_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-apollonius-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-analysis-evidence
          path: ${{ runner.temp }}/aeg-paper0-analysis-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-ripple-evidence
          path: ${{ runner.temp }}/aeg-paper0-ripple-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-apollonius-evidence
          path: ${{ runner.temp }}/aeg-paper0-apollonius-evidence
          if-no-files-found: warn

  projective-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install blake3==1.0.9
      - name: Receive the pinned Lean release
        run: |
          curl --fail --location --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'lean.tar.zst'
          expected = 'b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec'
          if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
              raise SystemExit('Lean release digest mismatch')
          PY
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Prepare and fingerprint pinned Mathlib
        run: |
          python paper-0/formal/prepare_analysis.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean-bin "$RUNNER_TEMP/lean-4.24.0-linux/bin"
      - name: Check homogeneous projective action and concrete pole bridge
        run: |
          python paper-0/formal/projective_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-projective-evidence"
      - name: Check scalar faithfulness and the standard GL quotient
        run: |
          python paper-0/formal/pgl_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-pgl-evidence"
      - name: Check affine stabilizer and quotient-level generation
        run: |
          python paper-0/formal/affine_generation_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-affine-generation-evidence"
      - name: Check arithmetic grammar, pure-slot images and ordinary domains
        run: |
          python paper-0/formal/arithmetic_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-arithmetic-evidence"
      - name: Check finite stabilizer conjugacy, pole cosets and Bruhat cells
        run: |
          python paper-0/formal/bruhat_run.py \
            --mathlib-root "$RUNNER_TEMP/aeg-mathlib" \
            --lean "$RUNNER_TEMP/lean-4.24.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/aeg-paper0-bruhat-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-projective-evidence
          path: ${{ runner.temp }}/aeg-paper0-projective-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-pgl-evidence
          path: ${{ runner.temp }}/aeg-paper0-pgl-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-affine-generation-evidence
          path: ${{ runner.temp }}/aeg-paper0-affine-generation-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-arithmetic-evidence
          path: ${{ runner.temp }}/aeg-paper0-arithmetic-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeg-paper0-bruhat-evidence
          path: ${{ runner.temp }}/aeg-paper0-bruhat-evidence
          if-no-files-found: warn
